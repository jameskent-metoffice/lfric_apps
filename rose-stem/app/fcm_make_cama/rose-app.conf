# Builds CaMa-Flood as an OASIS3-MCT component, in place of the JULES river
# model that fcm_make_river builds. CaMa-Flood is not an FCM project, so this
# runs the build script of the cama_interface instead of the fcm_make built-in.
#
# The executable is installed in
# $CYLC_WORKFLOW_SHARE_DIR/$CYLC_TASK_NAME/build/bin/cama.exe,
# which is where the coupled run looks for it (cama_make_dir).
#
# OASIS3-MCT is found from OASIS_ROOT, or prism_path as for the JULES build;
# see the header of build_cama.sh for the other options.

[command]
default=$SOURCE_ROOT/lfric_apps/interfaces/cama_interface/build/build_cama.sh

[env]
CAMA_SOURCE=$SOURCE_ROOT/CaMa-Flood_v4
