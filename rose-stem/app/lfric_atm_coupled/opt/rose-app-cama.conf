# Option for lfric_atm_coupled in which CaMa-Flood replaces the JULES river
# model. The suite selects this with the "cama" option, which the tasks that
# set "cama" to true in their definition also use to build CaMa-Flood.
#
# CaMa-Flood receives the surface and sub-surface runoff of LFRic on its own
# map grid and sends the discharge of every river to NEMO, exactly as the JULES
# river model did. The settings here are for CaMa-Flood on its global 15 minute
# map; the files and sizes come from the environment of the task.

[command]
default=$CORE_ROOT_DIR/bin/tweak_iodef mydef.xml; \
       =mkdir -p $RIVER_DATA; \
       =gen_rivers_props_file_list.sh; \
       =cama_prepare.sh; \
       =run_model

[env]
# CaMa-Flood is not known to the MCT driver of MOCI, but it is described fully
# by the namcouple, so it does not need to be listed here
COUPLING_COMPONENTS=lfric nemo
models=lfric cama nemo si3 xios mct
# The weights of the coupled model with those of CaMa-Flood, put together by
# cama_prepare.sh
RMP_DIR=${CAMA_RMP_MERGED}

[file:input_cmf.nam]
source=namelist:nrunver namelist:ndimtime namelist:nparam namelist:nsimtime namelist:nmap namelist:nrestart namelist:nforce namelist:noutput

[file:cama_oasis.nml]
source=namelist:cama_oasis_nml

# The number of rivers is that of CPL_RIVER_COUNT, which NEMO also uses
[namelist:cama_oasis_nml]
cpl_freq=3600
river_count=1681
river_number_file='$CAMA_RIVER_NUMBER_FILE'
water_density=1000.0

[namelist:nrunver]
ladpstp=.true.
lpthout=.true.
lrestart=.false.
lrosplit=.true.

# The time step is the coupling period
[namelist:ndimtime]
cdiminfo='cama_diminfo.txt'
dt=3600
ifrq_inp=1

[namelist:nparam]
pcadp=0.7
pdstmth=10000.0
pmanfld=0.1
pmanriv=0.03

# The dates are set by the MOCI CaMa-Flood driver
[namelist:nsimtime]
eday=1
ehour=0
emon=1
eyear=2000
sday=1
shour=0
smon=1
syear=2000

[namelist:nmap]
celevtn='$CAMA_MAP_DIR/elevtn.bin'
cfldhgt='$CAMA_MAP_DIR/fldhgt.bin'
cgrarea='$CAMA_MAP_DIR/ctmare.bin'
cnextxy='$CAMA_MAP_DIR/nextxy.bin'
cnxtdst='$CAMA_MAP_DIR/nxtdst.bin'
cpthout='$CAMA_MAP_DIR/bifprm.txt'
crivhgt='$CAMA_MAP_DIR/rivhgt.bin'
crivlen='$CAMA_MAP_DIR/rivlen.bin'
crivman='$CAMA_MAP_DIR/rivman.bin'
crivwth='$CAMA_MAP_DIR/rivwth_gwdlr.bin'
lmapcdf=.false.

# The restart file is set by the MOCI CaMa-Flood driver
[namelist:nrestart]
crestdir='$CAMA_DATA/'
creststo=''
cvnrest='restart'
ifrq_rst=0

# Runoff is received in kg m-2 s-1, which is mm s-1, on the map grid
[namelist:nforce]
drofunit=1000
linpcdf=.false.
linterp=.false.

[namelist:noutput]
coutdir='$CAMA_DATA/'
couttag=''
cvarsout='rivout,outflw,storge'
ifrq_out=24
loutcdf=.false.
loutvec=.false.
