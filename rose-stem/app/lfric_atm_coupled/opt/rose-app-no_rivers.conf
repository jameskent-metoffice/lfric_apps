# Lives in this app's opt/ so these keys override this app's rose-app.conf.
# Opt files from imported apps cannot override values set here.
[command]
default=$CORE_ROOT_DIR/bin/tweak_iodef mydef.xml; \
       =run_model

[env]
COUPLING_COMPONENTS=lfric nemo
CPL_RIVER_COUNT=0
models=lfric nemo si3 xios mct

# Rose would otherwise install file/namcouple (the rivers version) as namcouple.
# Kept outside file/ so Rose does not also install it, because OASIS_fields
# concatenates every namcouple* file in the work directory.
[file:namcouple]
source=$ROSE_SUITE_DIR/app/lfric_atm_coupled/no_rivers/namcouple

[namelist:jules_rivers]
l_rivers=.false.

[namelist:namsbc_cpl]
sn_rcv_rnf='none','no','','',''

[namelist:namsbc{nemo}]
ln_rnf=.false.
