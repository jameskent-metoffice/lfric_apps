[env]
XIOS_SERVER_MODE=True
XIOS_SERVER_RANKS=1

[namelist:extrusion]
domain_height=2000.0
number_of_layers=50

[namelist:idealised]
test='rotational'

[namelist:initial_density]
density_background=2.0

[namelist:initial_tracer_field]
field_background=2.0
field_max=5.0

[namelist:initial_wind]
profile='rotational'
sbr_angle_lat=0.0
u0=1.0

[namelist:io]
diagnostic_frequency=125
!!nodal_output_on_w3=
use_xios_io=.true.

[namelist:transport]
ffsl_vertical_order=2,3,3,3,3,3
reversible=.true.,.false.,.false.,.false.,.false.,.false.
vertical_monotone=1,1,1,1,1,1